<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=theme-color content="#06030a">
<title>PumpPulse Autopilot</title>
<style>
:root{--bg:#06030a;--pn:#0d0712;--ln:#2b1436;--mag:#ff2bd6;--bur:#5a0f3a;--g:#2fe58f;--r:#ff4d6d;--tx:#eadff2;--mu:#8d7a9b}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 400px at 70% -10%,#2a0b3a66,transparent),var(--bg);color:var(--tx);font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px 10px 40px;max-width:720px;margin:auto}
a{color:var(--mag);text-decoration:none}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-weight:800;text-shadow:0 0 10px #ff2bd699}
.card{background:var(--pn);border:1px solid var(--ln);padding:10px;margin-bottom:8px;box-shadow:0 0 18px #2a0b3a33}
h3{font-size:10px;letter-spacing:1px;color:var(--mag);margin-bottom:6px}
button{font:inherit;color:inherit;background:#1a0d24;border:1px solid var(--ln);padding:9px 12px;border-radius:5px;cursor:pointer}
input{font:inherit;font-size:16px;color:inherit;background:#12091a;border:1px solid var(--ln);border-radius:4px;padding:7px;width:100%}
.up{color:var(--g)}.dn{color:var(--r)}.mu{color:var(--mu)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:12px;font-weight:800}
.seg .on.off{background:#2a2033;border-color:var(--mu)}
.seg .on.paper{background:#3d3210;border-color:#ffd166;color:#ffd166}
.seg .on.live{background:#40121f;border-color:var(--r);color:var(--r);box-shadow:0 0 14px #ff4d6d66}
#panic{width:100%;padding:15px;font-weight:800;font-size:15px;background:linear-gradient(#d63a55,#8f1f33);border-color:var(--r);color:#fff;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.stat{border:1px solid var(--ln);padding:6px}.stat .k{color:var(--mu);font-size:9px}.stat .v{font-size:16px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #1b0f24}
label{font-size:9px;color:var(--mu);display:block;margin-bottom:2px}
#logb{max-height:240px;overflow:auto;font-size:11px;color:#c9b6d6}
.warn{color:#ffd166;font-size:11px}
</style></head><body>
<header><a href="/terminal" class=logo>⚡ PUMPPULSE</a><b>AUTOPILOT</b></header>

<div class=card><h3>BOT WALLET</h3>
 <div id=wal class=mu>Loading…</div></div>

<div class=card><h3>MODE</h3>
 <div class=seg id=seg>
  <button data-m=off class=off>OFF</button><button data-m=paper class=paper>PAPER</button><button data-m=live class=live>LIVE</button></div>
 <div class=mu id=modeNote style="margin-top:6px"></div></div>

<button id=panic>🛑 KILL SWITCH: SELL EVERYTHING &amp; STOP</button>

<div class=card><h3>PERFORMANCE (SOL)</h3><div class=grid id=stats></div></div>
<div class=card><h3>OPEN POSITIONS</h3><div id=pos></div></div>
<div class=card><h3>AI SETTINGS</h3><div class=grid id=cfg></div>
 <button id=save style="width:100%;margin-top:8px">SAVE SETTINGS</button></div>
<div class=card><h3>TRADE HISTORY</h3><div id=hist></div></div>
<div class=card><h3>DECISION LOG</h3><div id=logb></div></div>

<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let T=localStorage.t;if(!T||T==='null'){T=prompt('Access token')||'';localStorage.t=T}
const H={'X-Token':T,'Content-Type':'application/json'};
async function api(p,m='GET',b){const r=await fetch(p,{method:m,headers:H,body:b?JSON.stringify(b):undefined});
 if(r.status===401){localStorage.removeItem('t');location.reload();return}return r.json()}
const cls=v=>v>=0?'up':'dn',sg=(v,d=4)=>(v>=0?'+':'')+v.toFixed(d);
const FIELDS=[['size_sol','Trade size (SOL)'],['max_open','Max open trades'],['min_score','Min AI score'],['tp_pct','Take profit %'],['sl_pct','Stop loss %'],['trail_arm_pct','Trail arms at %'],['trail_pct','Trail distance %'],['max_hold_min','Max hold (min)'],['slippage_bps','Slippage (bps)'],['daily_loss_sol','Daily loss limit (SOL)'],['min_liq_usd','Min liquidity ($)'],['min_roundtrip','Min round-trip (0-1)']];
let built=false;
async function load(){
 const s=await api('/api/auto/state');if(!s)return;
 $('wal').innerHTML=s.wallet?`<div class=row><span>${s.wallet.slice(0,6)}…${s.wallet.slice(-6)}</span><button onclick="navigator.clipboard.writeText('${s.wallet}');this.textContent='Copied'">Copy address</button></div><div>Balance: <b>${s.sol==null?'…':s.sol.toFixed(4)} SOL</b></div><div class=mu style="font-size:11px;margin-top:4px">Fund this address from Phantom with a SMALL amount.</div>`:`<div class=warn>No wallet key set. PAPER mode works without one. For LIVE, add SOLANA_PRIVATE_KEY in Render.</div>`;
 document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===s.mode));
 $('modeNote').textContent=s.mode==='live'?'⚠ LIVE: trading REAL SOL':s.mode==='paper'?'Simulated with real Jupiter quotes. No money at risk.':'No new trades. Open positions are still managed.';
 $('stats').innerHTML=[['TODAY',sg(s.day_pnl),cls(s.day_pnl)],['TOTAL',sg(s.total_pnl),cls(s.total_pnl)],['TRADES',s.trades,''],['WIN RATE',s.trades?Math.round(s.wins/s.trades*100)+'%':'—',''],['OPEN',s.pos.length,''],['STATUS',s.halted?'HALTED (loss limit)':'ACTIVE',s.halted?'dn':'up']].map(([k,v,c])=>`<div class=stat><div class=k>${k}</div><div class="v ${c}">${v}</div></div>`).join('');
 $('pos').innerHTML=s.pos.map(p=>`<div class=row><span><b>${esc(p.sym)}</b> <span class=mu>${p.mode} · score ${p.score} · ${Math.round((Date.now()/1000-p.opened)/60)}m</span></span><span><b class=${cls(p.pnl_pct)}>${p.pnl_pct.toFixed(1)}%</b> <span class=mu>${p.value.toFixed(3)}◎</span> ${p.stuck?`<button data-f="${p.mint}">Forget</button>`:''} <button data-c="${p.mint}">Sell</button></span></div>${p.stuck?'<div class=warn>STUCK: sell manually in Phantom/Jupiter, then Forget</div>':''}`).join('')||'<div class=mu>None</div>';
 $('hist').innerHTML=s.hist.slice(0,15).map(h=>`<div class=row><span>${esc(h.sym)} <span class=mu>${h.mode} · ${h.reason}</span></span><span class=${cls(h.pnl_sol)}>${sg(h.pnl_sol)}◎ (${h.pnl_pct}%)</span></div>`).join('')||'<div class=mu>No trades yet</div>';
 $('logb').innerHTML=s.log.map(esc).join('<br>');
 if(!built){built=true;$('cfg').innerHTML=FIELDS.map(([k,l])=>`<div><label>${l}</label><input id=f_${k} inputmode=decimal value="${s.cfg[k]}"></div>`).join('')}
}
const $=id=>document.getElementById(id);
document.getElementById('seg').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const m=b.dataset.m;let body={mode:m};
 if(m==='live'){const c=prompt('This trades REAL SOL from the bot wallet. Type GO LIVE to confirm:');if(c===null)return;body.confirm=c}
 const r=await api('/api/auto/mode','POST',body);if(!r.ok)alert(r.error);load()};
$('panic').onclick=async()=>{if(confirm('Sell ALL positions and stop the bot?')){await api('/api/auto/panic','POST');load()}};
$('save').onclick=async()=>{const b={};FIELDS.forEach(([k])=>b[k]=$('f_'+k).value);await api('/api/auto/cfg','POST',b);built=false;await load();alert('Saved (values are clamped to safe limits)')};
document.addEventListener('click',async e=>{const c=e.target.closest('[data-c]'),f=e.target.closest('[data-f]');
 if(c){await api('/api/auto/close/'+c.dataset.c,'POST');load()}
 if(f){await api('/api/auto/forget/'+f.dataset.f,'POST');load()}});
load();setInterval(load,4000);
</script></body></html>
